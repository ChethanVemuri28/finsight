
<template>
    <lightning-card
        title="Recent Transactions"
        icon-name="standard:orders">

        
        <div slot="actions" class="header-actions">
            <lightning-button
                label="Reset"
                icon-name="utility:refresh"
                variant="neutral"
                onclick={handleResetFilters}>
            </lightning-button>

            <lightning-button
                label="Filter"
                icon-name="utility:filterList"
                variant="brand"
                onclick={openFilterModal}>
            </lightning-button>
        </div>

        <div class="slds-p-around_medium">
            <lightning-datatable
                key-field="Id"
                data={transactions}
                columns={columns}
                is-loading={isLoading}
                hide-checkbox-column
                onrowaction={handleRowAction}>
            </lightning-datatable>

            <template lwc:if={isEmpty}>
                <p class="slds-p-top_medium slds-text-color_weak">
                    No transactions match your search or filters.
                </p>
            </template>
        </div>
    </lightning-card>

    <!-- Search and Filter Modal -->
    <!-- Keep the component mounted so filter values are preserved. -->
    <section
        role="dialog"
        tabindex="-1"
        aria-modal="true"
        aria-labelledby="filter-modal-heading"
        class={filterModalClass}>

        <div class="slds-modal__container">

            <header class="slds-modal__header">
                <lightning-button-icon
                    icon-name="utility:close"
                    alternative-text="Close"
                    title="Close"
                    onclick={closeFilterModal}
                    class="slds-modal__close">
                </lightning-button-icon>

                <h2
                    id="filter-modal-heading"
                    class="slds-text-heading_medium">
                    Search and Filter Transactions
                </h2>

                <p class="slds-m-top_x-small slds-text-color_weak">
                    Narrow your transactions by name, type, category or date.
                </p>
            </header>

            <div class="slds-modal__content slds-p-around_medium">
                <c-transaction-search-filters
                    onfilterapply={handleFilterApply}
                    onfiltererror={handleFilterError}>
                </c-transaction-search-filters>
            </div>

            <footer class="slds-modal__footer">
                <lightning-button
                    label="Close"
                    onclick={closeFilterModal}>
                </lightning-button>
            </footer>

        </div>
    </section>

    <template lwc:if={isFilterModalOpen}>
        <div
            class="slds-backdrop slds-backdrop_open"
            onclick={closeFilterModal}>
        </div>
    </template>

    <!-- Edit Transaction Modal -->
    <template lwc:if={isEditModalOpen}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="edit-modal-heading"
            class="slds-modal slds-fade-in-open">

            <div class="slds-modal__container">

                <header class="slds-modal__header">
                    <lightning-button-icon
                        icon-name="utility:close"
                        alternative-text="Close"
                        title="Close"
                        onclick={closeEditModal}
                        class="slds-modal__close">
                    </lightning-button-icon>

                    <h2
                        id="edit-modal-heading"
                        class="slds-text-heading_medium">
                        Edit Transaction
                    </h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium edit-form">

                    <lightning-input
                        label="Transaction Name"
                        value={editName}
                        data-field="editName"
                        onchange={handleEditInputChange}
                        required>
                    </lightning-input>

                    <lightning-input
                        class="slds-m-top_small"
                        type="date"
                        label="Transaction Date"
                        value={editDate}
                        data-field="editDate"
                        onchange={handleEditInputChange}
                        required>
                    </lightning-input>

                    <lightning-input
                        class="slds-m-top_small"
                        type="number"
                        label="Amount (₹)"
                        value={editAmount}
                        data-field="editAmount"
                        onchange={handleEditInputChange}
                        min="0.01"
                        step="0.01"
                        required>
                    </lightning-input>

                    <lightning-combobox
                        class="slds-m-top_small"
                        label="Transaction Type"
                        value={editType}
                        data-field="editType"
                        options={transactionTypeOptions}
                        onchange={handleEditInputChange}
                        required>
                    </lightning-combobox>

                    <lightning-combobox
                        class="slds-m-top_small"
                        label="Category"
                        value={editCategory}
                        data-field="editCategory"
                        options={categoryOptions}
                        onchange={handleEditInputChange}
                        required>
                    </lightning-combobox>

                </div>

                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Cancel"
                        onclick={closeEditModal}
                        disabled={isSaving}>
                    </lightning-button>

                    <lightning-button
                        class="slds-m-left_small"
                        label="Save Changes"
                        variant="brand"
                        onclick={handleUpdate}
                        disabled={isSaving}>
                    </lightning-button>
                </footer>

            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
