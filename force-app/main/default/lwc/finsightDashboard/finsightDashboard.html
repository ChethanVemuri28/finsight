
<template>
    <lightning-card title="FinSight Overview" icon-name="standard:dashboard">
        <div class="slds-p-around_medium">

            <!-- Summary Cards -->
            <div class="slds-grid slds-wrap slds-gutters">

                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-bottom_medium">
                    <div class="metric-card income">
                        <p>Total Income</p>
                        <h2>{formattedIncome}</h2>
                    </div>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-bottom_medium">
                    <div class="metric-card expense">
                        <p>Total Expenses</p>
                        <h2>{formattedExpenses}</h2>
                    </div>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-bottom_medium">
                    <div class="metric-card savings">
                        <p>Net Savings</p>
                        <h2>{formattedSavings}</h2>
                    </div>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-bottom_medium">
                    <div class="metric-card rate">
                        <p>Savings Rate</p>
                        <h2>{formattedSavingsRate}</h2>
                    </div>
                </div>

            </div>

            <!-- Month and Year Filters -->
            <div class="slds-grid slds-wrap slds-gutters slds-m-top_medium">

                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-combobox
                        label="Month"
                        value={selectedMonth}
                        options={monthOptions}
                        onchange={handleMonthChange}>
                    </lightning-combobox>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-combobox
                        label="Year"
                        value={selectedYear}
                        options={yearOptions}
                        onchange={handleYearChange}>
                    </lightning-combobox>
                </div>

            </div>

            <!-- Loading Indicator -->
            <template lwc:if={isLoading}>
                <lightning-spinner
                    alternative-text="Loading financial summary">
                </lightning-spinner>
            </template>

            <!-- Error Message -->
            <template lwc:if={errorMessage}>
                <div class="slds-text-color_error slds-m-top_medium">
                    {errorMessage}
                </div>
            </template>

            <!-- Refresh Button -->
            <div class="slds-m-top_large">
                <lightning-button
                    label="Refresh"
                    icon-name="utility:refresh"
                    onclick={handleRefresh}>
                </lightning-button>
            </div>

        </div>
    </lightning-card>
</template>
