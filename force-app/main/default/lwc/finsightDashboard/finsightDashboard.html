
<template>
    <lightning-card
        title="FinSight Overview"
        icon-name="standard:dashboard">

        
        <div slot="actions" class="header-actions">
            <lightning-button
                label="Refresh"
                icon-name="utility:refresh"
                variant="neutral"
                onclick={handleRefresh}
                disabled={isLoading}>
            </lightning-button>

            <lightning-button
                label="Add Transaction"
                icon-name="utility:add"
                variant="brand"
                onclick={handleOpenAddModal}>
            </lightning-button>
        </div>

        <div class="dashboard-content">

            <!-- Financial Summary -->
            <div class="slds-grid slds-wrap slds-gutters">

                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-bottom_medium">
                    <div class="metric-card income">
                        <p>Total Income</p>
                        <h2>{formattedIncome}</h2>
                    </div>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-bottom_medium">
                    <div class="metric-card expense">
                        <p>Total Expenses</p>
                        <h2>{formattedExpenses}</h2>
                    </div>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-bottom_medium">
                    <div class="metric-card savings">
                        <p>Net Savings</p>
                        <h2>{formattedSavings}</h2>
                    </div>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-bottom_medium">
                    <div class="metric-card rate">
                        <p>Savings Rate</p>
                        <h2>{formattedSavingsRate}</h2>
                    </div>
                </div>

            </div>

            <!-- Period Filters -->
            <div class="filter-panel">
                <h2 class="filter-heading">
                    Financial Period
                </h2>

                <div class="slds-grid slds-wrap slds-gutters">

                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-combobox
                            label="Month"
                            value={selectedMonth}
                            options={monthOptions}
                            onchange={handleMonthChange}>
                        </lightning-combobox>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-combobox
                            label="Year"
                            value={selectedYear}
                            options={yearOptions}
                            onchange={handleYearChange}>
                        </lightning-combobox>
                    </div>

                </div>
            </div>

            <!-- Loading Indicator -->
            <template lwc:if={isLoading}>
                <div class="loading-container">
                    <lightning-spinner
                        alternative-text="Loading financial summary"
                        size="medium">
                    </lightning-spinner>
                </div>
            </template>

            <!-- Error Message -->
            <template lwc:if={errorMessage}>
                <div class="error-message" role="alert">
                    {errorMessage}
                </div>
            </template>

            <!-- Dashboard Actions -->
            <!-- <div class="dashboard-actions">
                <lightning-button
                    label="Refresh Summary"
                    icon-name="utility:refresh"
                    variant="neutral"
                    onclick={handleRefresh}>
                </lightning-button>
            </div> -->

        </div>
    </lightning-card>

    <!-- Add Transaction Modal -->
    <template lwc:if={isAddModalOpen}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="add-transaction-modal-heading"
            class="slds-modal slds-fade-in-open">

            <div class="slds-modal__container modal-container">

                <header class="slds-modal__header modal-header">
                    <lightning-button-icon
                        icon-name="utility:close"
                        alternative-text="Close"
                        title="Close"
                        onclick={handleCloseAddModal}
                        class="slds-modal__close"
                        variant="bare-inverse">
                    </lightning-button-icon>

                    <h2
                        id="add-transaction-modal-heading"
                        class="modal-title">
                        Add Transaction
                    </h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium modal-content">
                    <c-transaction-manager
                        ontransactionsaved={handleTransactionSaved}
                        onclosemodal={handleCloseAddModal}>
                    </c-transaction-manager>
                </div>

            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
